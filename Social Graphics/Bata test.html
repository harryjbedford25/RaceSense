
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">

<title>RaceSense Beta Release</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        background: #101012;
        color: #FFFFFF;
        overflow: hidden;
    }

    .graphic {
        width: 1080px;
        height: 1350px;
        padding: 70px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
            radial-gradient(
                circle at 85% 15%,
                rgba(204,255,0,0.08),
                transparent 30%
            ),
            #101012;
    }

    /* subtle technical grid */
    .graphic::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.055;
        background-image:
            linear-gradient(#FFFFFF 1px, transparent 1px),
            linear-gradient(90deg, #FFFFFF 1px, transparent 1px);
        background-size: 54px 54px;
        pointer-events: none;
    }

    .top {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .logo {
        font-family: "JetBrains Mono", monospace;
        font-size: 31px;
        font-weight: 600;
        letter-spacing: -1.5px;
        position: relative;
        display: inline-block;
        padding-bottom: 13px;
    }

    .logo::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 4px;
        background: #CCFF00;
    }

    .status {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 500;
        color: #CCFF00;
        border: 1px solid #CCFF00;
        padding: 12px 17px;
        letter-spacing: 1px;
    }

    .content {
        position: relative;
        z-index: 2;
        margin-top: -30px;
    }

    .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 500;
        color: #CCFF00;
        letter-spacing: 2px;
        margin-bottom: 25px;
        text-transform: uppercase;
    }

    h1 {
        margin: 0;
        max-width: 900px;
        font-family: "Inter", sans-serif;
        font-size: 132px;
        line-height: 0.88;
        letter-spacing: -7px;
        font-weight: 600;
    }

    h1 span {
        color: #CCFF00;
    }

    .description {
        margin-top: 45px;
        max-width: 760px;
        font-family: "JetBrains Mono", monospace;
        font-size: 25px;
        line-height: 1.55;
        color: #D8D8D8;
    }

    .description strong {
        color: #FFFFFF;
        font-weight: 600;
    }

    .cta {
        margin-top: 55px;
        display: inline-flex;
        align-items: center;
        gap: 20px;
        background: #CCFF00;
        color: #101012;
        padding: 21px 28px;
        font-family: "JetBrains Mono", monospace;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .arrow {
        font-size: 27px;
    }

    .bottom {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .beta {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        line-height: 1.6;
        color: #888888;
    }

    .beta span {
        color: #CCFF00;
    }

    .version {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        color: #666666;
        text-align: right;
    }

    .corner {
        position: absolute;
        right: 70px;
        bottom: 185px;
        width: 140px;
        height: 140px;
        border-right: 2px solid #CCFF00;
        border-bottom: 2px solid #CCFF00;
        opacity: 0.6;
    }

    .corner::before {
        content: "";
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 55px;
        height: 2px;
        background: #CCFF00;
        transform: rotate(-45deg);
        transform-origin: right center;
    }
</style>
</head>

<body>

<div class="graphic">

    <div class="top">
        <div class="logo">[RACESENSE]</div>
        <div class="status">BETA // 01.09.26</div>
    </div>

    <div class="content">

        <div class="eyebrow">THE WAIT IS OVER</div>

        <h1>
            RACESENSE<br>
            IS <span>LIVE.</span>
        </h1>

        <div class="description">
            Your race engineer.<br>
            <strong>Now available for beta testing.</strong><br><br>
            Get live race communication without
            needing a whole team on the pit wall.
        </div>

        <div class="cta">
            DM US FOR DOWNLOAD
            <span class="arrow">↗</span>
        </div>

    </div>

    <div class="bottom">
        <div class="beta">
            <span>// BETA ACCESS</span><br>
            Limited tester access
        </div>

        <div class="version">
            RACESENSE<br>
            ANDROID // BETA
        </div>
    </div>

    <div class="corner"></div>

</div>

</body>
</html>
