services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  node_modules:
